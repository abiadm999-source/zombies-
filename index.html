<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Rift Stand: iPhone Survival Prototype</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050607;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; touch-action: none;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  body { position: fixed; inset: 0; }
  #game { width: 100vw; height: 100vh; height: 100svh; display: block; touch-action: none; }
  .hud { position: fixed; inset: 0; pointer-events: none; color: #f7efe2; text-shadow: 0 2px 4px #000; }
  .top {
    position: absolute; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px;
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px;
    font-size: clamp(12px, 3.2vw, 15px); font-weight: 900; align-items: start;
  }
  .top > div:nth-child(2) { text-align: center; white-space: nowrap; font-size: clamp(11px, 2.8vw, 13px); color: #78f4ff; }
  .top > div:last-child { text-align: right; }
  .healthPanel {
    position: absolute; top: calc(max(12px, env(safe-area-inset-top)) + 42px); left: 12px; right: 12px;
    display: grid; gap: 8px; max-width: 460px; margin: 0 auto;
  }
  .playerBar { background: rgba(0,0,0,.58); border: 1px solid rgba(255,255,255,.22); padding: 8px; border-radius: 8px; }
  .barLabel { display: flex; justify-content: space-between; font-size: 12px; font-weight: 900; margin-bottom: 5px; }
  .barTrack { height: 15px; background: #351212; overflow: hidden; border-radius: 999px; }
  .barFill { height: 100%; width: 100%; background: linear-gradient(90deg, #58f076, #e4ff73); transition: width .12s linear; }
  .effectText { color: #7df7ff; font-size: 11px; min-height: 13px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .centerMsg {
    position: absolute; top: 26%; left: 50%; transform: translate(-50%, -50%);
    width: min(760px, calc(100vw - 28px)); text-align: center; font-weight: 950;
    text-transform: uppercase; letter-spacing: 1px; pointer-events: none; z-index: 4;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,.85));
  }
  .centerMsg .main { color: #f7efe2; font-size: clamp(28px, 9vw, 58px); line-height: .95; }
  .centerMsg .sub { color: #78f4ff; font-size: clamp(13px, 3.8vw, 20px); margin-top: 9px; }
  .centerMsg.boss .main { color: #ff7d43; }
  .centerMsg.clear .main { color: #6ff072; }
  .centerMsg.map .main { color: #78f4ff; }
  .centerMsg.med .main { color: #ff78a7; }
  .centerMsg.rapid .main { color: #ffe56f; }
  .centerMsg.bomb .main { color: #ff8a2f; }
  .centerMsg.shield .main { color: #78f4ff; }
  .centerMsg.crossbow .main { color: #ffd36b; }
  .centerMsg.sword .main { color: #cfffff; }
  .fadeOverlay {
    position: absolute; inset: 0; background: #050607; opacity: 0;
    pointer-events: none; transition: opacity .08s linear;
  }
  .menu, .over, .pause {
    position: absolute; inset: 0; display: grid; place-items: center; padding: max(18px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
    background: radial-gradient(circle at 50% 35%, rgba(19,37,38,.42), rgba(0,0,0,.82));
    pointer-events: auto; z-index: 8;
  }
  .panel { text-align: center; color: #f7efe2; width: min(440px, 100%); }
  h1 { margin: 0 0 10px; color: #77f4ff; font-size: clamp(44px, 14vw, 70px); line-height: .9; letter-spacing: 1px; }
  p { margin: 0 0 18px; color: #d9cbbb; font-size: 14px; line-height: 1.45; }
  .controlCopy { display: grid; gap: 8px; margin: 20px auto 22px; color: #f7efe2; font-weight: 800; font-size: 14px; }
  button {
    border: 0; min-height: 54px; margin: 8px; padding: 15px 26px; border-radius: 999px;
    font: 900 16px ui-monospace, monospace; color: #071015; background: #75f4ff;
    cursor: pointer; touch-action: manipulation;
  }
  .secondaryButton { background: #f4e7c6; }
  .touchControls { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .joystick {
    position: absolute; left: max(22px, env(safe-area-inset-left)); bottom: calc(max(24px, env(safe-area-inset-bottom)) + 14px);
    width: 136px; height: 136px; border-radius: 50%; border: 2px solid rgba(120,244,255,.46);
    background: rgba(6,18,22,.38); box-shadow: inset 0 0 24px rgba(120,244,255,.12), 0 8px 24px rgba(0,0,0,.45);
    pointer-events: auto; touch-action: none;
  }
  .stick {
    position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; border-radius: 50%;
    transform: translate(-50%, -50%); background: rgba(120,244,255,.76);
    border: 2px solid rgba(255,255,255,.7); box-shadow: 0 8px 18px rgba(0,0,0,.5);
  }
  .fireButton {
    position: absolute; right: max(22px, env(safe-area-inset-right)); bottom: calc(max(26px, env(safe-area-inset-bottom)) + 18px);
    width: 126px; height: 126px; border-radius: 50%; border: 2px solid rgba(255,255,255,.55);
    background: radial-gradient(circle, rgba(255,111,36,.95), rgba(156,38,20,.88));
    color: #fff7df; display: grid; place-items: center; font-size: 18px; font-weight: 950; letter-spacing: 1px;
    pointer-events: auto; touch-action: none; box-shadow: 0 8px 26px rgba(0,0,0,.5);
  }
  .fireButton.active { transform: scale(.96); filter: brightness(1.18); }
  .rotateNotice {
    position: absolute; inset: 0; display: none; place-items: center; padding: 28px; text-align: center;
    background: rgba(0,0,0,.86); color: #f7efe2; font-weight: 900; z-index: 12; pointer-events: none;
  }
  @media (orientation: landscape) and (max-height: 520px) {
    .rotateNotice { display: grid; }
  }
  .hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div class="top">
    <div id="leftHud">SCORE 0<br>WAVE 1</div>
    <div>RIFT STAND</div>
    <div id="rightHud">ZONE 1<br>HP 100</div>
  </div>
  <div id="fadeOverlay" class="fadeOverlay"></div>
  <div id="centerMsg" class="centerMsg hidden"><div class="main"></div><div class="sub"></div></div>
  <div class="healthPanel">
    <div id="p1Bar" class="playerBar">
      <div class="barLabel"><span>HP</span><span id="p1Hp">100</span></div>
      <div class="barTrack"><div id="p1Fill" class="barFill"></div></div>
      <div id="p1Effects" class="effectText"></div>
    </div>
  </div>
  <div id="menu" class="menu">
    <div class="panel">
      <h1>RIFT STAND</h1>
      <p>Mobile zombie survival prototype.</p>
      <div class="controlCopy">
        <div>Move with left joystick</div>
        <div>Hold right button to fire</div>
      </div>
      <button id="startButton">START GAME</button>
    </div>
  </div>
  <div id="pause" class="pause hidden"><div class="panel"><h1>PAUSED</h1><p>Press P to resume</p></div></div>
  <div id="over" class="over hidden"><div class="panel"><h1>GAME OVER</h1><p id="overText"></p><button id="again">RESTART</button><button id="menuButton" class="secondaryButton">MENU</button></div></div>
  <div id="touchControls" class="touchControls hidden">
    <div id="joystickBase" class="joystick"><div id="joystickThumb" class="stick"></div></div>
    <div id="fireButton" class="fireButton">FIRE</div>
  </div>
  <div id="rotateNotice" class="rotateNotice">Rotate to portrait for the best iPhone play.</div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js";

const CFG = {
  arenaW: 90, arenaH: 70, playerSpeed: 11, turnSpeed: 2.7,
  zombieSpeed: 1.825, runnerSpeed: 2.85, bruteSpeed: 1.225,
  playerHP: 100, bulletSpeed: 42, bulletLife: .85, shootCD: .2,
  waveBase: 6, waveAdd: 3, stunTime: .48, corpseTime: 4.0, corpseFade: 1.1,
  waveBreak: 3.0, waveClearBonus: 120, bossClearBonus: 500,
  contactDamageCD: .82, playerIFrame: .58,
  bossFlameRange: 15.5, bossFlameWidth: .76, bossFlameDamage: 18, bossFlameCD: 3.2, bossFlameWarn: .9, bossFlameBurst: 1.15,
  gateOpenTime: 3.4, spawnStagger: .42, powerupFloatY: 1.18, bombRadius: 12,
  weaponDuration: 45, crossbowCD: .72, arrowSpeed: 30, arrowLife: 1.6, arrowBlastRadius: 4.2, arrowDamage: 95,
  swordCD: .34, swordRange: 4.4, swordDamage: 105,
  powerupMin: 12, powerupMax: 18, rapidDuration: 7, shieldDuration: 6
};

const ITEM_INFO = {
  med: { label:"MEDKIT", short:"MED", color:0xff4f86, tone:"med" },
  rapid: { label:"RAPID FIRE", short:"RAPID", color:0xffdf4f, tone:"rapid" },
  bomb: { label:"BOMB", short:"BOMB", color:0xff8a2f, tone:"bomb" },
  shield: { label:"SHIELD", short:"SHIELD", color:0x78f4ff, tone:"shield" },
  crossbow: { label:"CROSSBOW", short:"BOW", color:0xffd36b, tone:"crossbow" },
  sword: { label:"ENERGY SWORD", short:"SWORD", color:0xbff8ff, tone:"sword" }
};

const canvas = document.getElementById("game");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080b0e);
scene.fog = new THREE.Fog(0x080b0e, 45, 105);

const hemi = new THREE.HemisphereLight(0xbfd7ff, 0x101010, 1.7);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(-25, 45, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);
const rim = new THREE.DirectionalLight(0x74f5ff, 1.4);
rim.position.set(28, 20, -24);
scene.add(rim);
const streetGlow = new THREE.PointLight(0xffd27a, .85, 36);
streetGlow.position.set(0, 9, 0);
scene.add(streetGlow);

const keys = {};
let phase = "menu", mode = 1, wave = 0, score = 0, last = 0, startLocked = false, survivalStart = 0, survivalSeconds = 0;
let players = [], zombies = [], bullets = [], impacts = [], stunBursts = [], powerups = [], corpses = [], flames = [], walls = [], wallBounds = [], spawnQueue = [];
let nextPowerup = 10, betweenWaves = false, waveTimer = 0, centerMsgTimer = 0, screenShake = 0;
let currentMapIndex = 0, currentZone = 1, fadeTimer = 0, fadeMax = 1, breakMain = "", breakSub = "", breakTone = "clear";
const centerMsg = document.getElementById("centerMsg");
const centerMain = centerMsg.querySelector(".main");
const centerSub = centerMsg.querySelector(".sub");
const fadeOverlay = document.getElementById("fadeOverlay");
const touchControls = document.getElementById("touchControls");
const joystickBase = document.getElementById("joystickBase");
const joystickThumb = document.getElementById("joystickThumb");
const fireButton = document.getElementById("fireButton");
const mobileInput = {
  movePointer: null, firePointer: null, x: 0, y: 0, mag: 0, fire: false,
  lastMoveDir: new THREE.Vector3(0, 0, -1)
};
const cameraRig = { pos: null, look: null, dt: 0 };
const BASE_NAV_POINTS = [
  [-36,-26],[-18,-26],[0,-26],[18,-26],[36,-26],
  [-36,-9],[-18,-9],[0,-9],[18,-9],[36,-9],
  [-36,0],[-18,0],[0,0],[18,0],[36,0],
  [-36,9],[-18,9],[0,9],[18,9],[36,9],
  [-36,26],[-18,26],[0,26],[18,26],[36,26]
];
let NAV_POINTS = BASE_NAV_POINTS.map(([x,z]) => new THREE.Vector3(x,0,z));
const SPAWN_GATES = [
  { name:"NORTH", x:0, z:-31.7, dir:new THREE.Vector3(0,0,1), rot:Math.PI },
  { name:"SOUTH", x:0, z:31.7, dir:new THREE.Vector3(0,0,-1), rot:0 },
  { name:"WEST", x:-41.7, z:0, dir:new THREE.Vector3(1,0,0), rot:-Math.PI/2 },
  { name:"EAST", x:41.7, z:0, dir:new THREE.Vector3(-1,0,0), rot:Math.PI/2 }
];
const MAP_BOUNDARY_WALLS = [
  [-44,0,1,4,70], [44,0,1,4,70], [0,-34,90,4,1], [0,34,90,4,1]
];
const MAP_LAYOUTS = [
  {
    name:"Depot Crossing",
    spawns:[[-10,6,Math.PI],[10,6,Math.PI]],
    walls:[[-27,-18,12,6,2], [25,18,14,7,2], [0,22,22,5,2], [0,-20,22,5,2], [-17,8,4,7,16], [17,-8,4,7,16]]
  },
  {
    name:"Loading Yard",
    spawns:[[-12,10,Math.PI * .8],[12,10,-Math.PI * .8]],
    walls:[[-28,0,10,5,2], [28,0,10,5,2], [-10,-20,18,5,2], [12,21,18,5,2], [0,0,5,6,18], [-24,19,4,5,12], [24,-19,4,5,12]]
  },
  {
    name:"Broken Avenue",
    spawns:[[0,11,Math.PI],[-8,8,Math.PI]],
    walls:[[-31,-15,13,5,2], [31,15,13,5,2], [-31,15,13,5,2], [31,-15,13,5,2], [-10,0,4,6,18], [10,0,4,6,18], [0,-23,16,5,2], [0,23,16,5,2]]
  }
];

function rand(a, b) { return a + Math.random() * (b - a); }

document.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (["Space","Enter","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
  if ((e.code === "Enter" || e.code === "Digit1") && phase === "menu") safeStartGame();
  if (e.code === "KeyP" && phase !== "menu" && phase !== "over") setPhase(phase === "pause" ? "play" : "pause");
  if (e.code === "KeyR" && phase !== "menu") start();
});
document.addEventListener("keyup", e => keys[e.code] = false);
document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("contextmenu", e => e.preventDefault());

function bindPressButton(id, action) {
  const button = document.getElementById(id);
  let lastPress = 0;
  const begin = e => {
    e.preventDefault();
    const now = performance.now();
    if (now - lastPress < 350) return;
    lastPress = now;
    action();
  };
  button.addEventListener("pointerdown", begin, { passive: false });
  button.addEventListener("touchend", begin, { passive: false });
  button.addEventListener("click", begin);
}
bindPressButton("startButton", safeStartGame);
bindPressButton("again", () => start());
bindPressButton("menuButton", () => {
  cleanupDynamic();
  setPhase("menu");
});

async function safeStartGame() {
  if (startLocked) return;
  startLocked = true;
  try {
    await initAudioSafely();
  } catch (err) {
    console.warn("Audio unavailable; continuing silently.", err);
  }
  start();
  setTimeout(() => startLocked = false, 500);
}

async function initAudioSafely() {
  const ctx = window.__riftAudioContext;
  if (ctx && ctx.state === "suspended") await ctx.resume();
}

function bindTouchControls() {
  joystickBase.addEventListener("pointerdown", e => {
    e.preventDefault();
    mobileInput.movePointer = e.pointerId;
    joystickBase.setPointerCapture?.(e.pointerId);
    updateJoystick(e);
  }, { passive: false });
  fireButton.addEventListener("pointerdown", e => {
    e.preventDefault();
    mobileInput.firePointer = e.pointerId;
    mobileInput.fire = true;
    fireButton.classList.add("active");
    fireButton.setPointerCapture?.(e.pointerId);
  }, { passive: false });
  document.addEventListener("pointermove", e => {
    if (e.pointerId === mobileInput.movePointer) {
      e.preventDefault();
      updateJoystick(e);
    }
  }, { passive: false });
  document.addEventListener("pointerup", releasePointer, { passive: false });
  document.addEventListener("pointercancel", releasePointer, { passive: false });
}

function updateJoystick(e) {
  const rect = joystickBase.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const radius = rect.width * .38;
  let dx = e.clientX - cx;
  let dy = e.clientY - cy;
  const dist = Math.hypot(dx, dy);
  if (dist > radius) {
    dx = dx / dist * radius;
    dy = dy / dist * radius;
  }
  mobileInput.x = dx / radius;
  mobileInput.y = dy / radius;
  mobileInput.mag = Math.min(1, dist / radius);
  joystickThumb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}

function releasePointer(e) {
  if (e.pointerId === mobileInput.movePointer) {
    mobileInput.movePointer = null;
    mobileInput.x = 0;
    mobileInput.y = 0;
    mobileInput.mag = 0;
    joystickThumb.style.transform = "translate(-50%, -50%)";
  }
  if (e.pointerId === mobileInput.firePointer) {
    mobileInput.firePointer = null;
    mobileInput.fire = false;
    fireButton.classList.remove("active");
  }
}
bindTouchControls();

function mat(color, rough=0.72, metal=0.05) {
  return new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal });
}
function mesh(geo, material, cast=true, receive=false) {
  const m = new THREE.Mesh(geo, material);
  m.castShadow = cast; m.receiveShadow = receive;
  return m;
}
function box(w,h,d,color) { return mesh(new THREE.BoxGeometry(w,h,d), mat(color)); }
function cyl(r,h,color, seg=18) { return mesh(new THREE.CylinderGeometry(r,r,h,seg), mat(color)); }
function sphere(r,color, seg=18) { return mesh(new THREE.SphereGeometry(r,seg,seg), mat(color)); }
function cone(r,h,color,seg=18) { return mesh(new THREE.ConeGeometry(r,h,seg), mat(color)); }
function torus(r,t,color,seg=18,tube=8) { return mesh(new THREE.TorusGeometry(r,t,seg,tube), mat(color)); }
function addObj(root, obj, x=0, y=0, z=0, rx=0, ry=0, rz=0) {
  obj.position.set(x,y,z);
  obj.rotation.set(rx,ry,rz);
  root.add(obj);
  return obj;
}
function shiny(color, rough=.34, metal=.65) { return new THREE.MeshStandardMaterial({color, roughness:rough, metalness:metal}); }
function glowMat(color, intensity=1) { return new THREE.MeshStandardMaterial({color, emissive:color, emissiveIntensity:intensity, roughness:.35}); }
function markEffectVisual(root) {
  root.traverse(o => o.userData.effect = true);
}
function restoreOpaqueMaterial(material) {
  const mats = Array.isArray(material) ? material : [material];
  mats.forEach(m => {
    if (!m || m.userData.allowFade) return;
    m.transparent = false;
    m.opacity = 1;
    m.depthWrite = true;
    m.needsUpdate = true;
  });
}
function markModelAlwaysVisible(root) {
  root.visible = true;
  root.traverse(o => {
    o.frustumCulled = false;
    if (o.userData.effect) return;
    o.visible = true;
    if (o.material) restoreOpaqueMaterial(o.material);
  });
}
function makeZombieFallbackCore(type) {
  const color = type === "boss" ? 0x3b2921 : type === "runner" ? 0x5b284e : 0x51603f;
  const material = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, depthTest: true, depthWrite: true });
  const core = new THREE.Mesh(new THREE.CapsuleGeometry(.32, 2.22, 5, 10), material);
  core.name = "alwaysVisibleZombieCore";
  core.position.y = 1.86;
  core.castShadow = false;
  core.receiveShadow = false;
  core.frustumCulled = false;
  core.userData.visualCore = true;
  return core;
}
function ensureAliveVisible(z) {
  if (!z || z.userData.dead) return;
  const base = z.userData.baseScale || 1;
  z.visible = true;
  if (z.scale.y < base * .35) z.scale.y = base;
  if (z.scale.z < base * .35) z.scale.z = base;
  z.traverse(o => {
    o.frustumCulled = false;
    if (o.userData.effect) return;
    o.visible = true;
    if (o.material) restoreOpaqueMaterial(o.material);
  });
}

function buildWorld() {
  const ground = mesh(new THREE.PlaneGeometry(CFG.arenaW, CFG.arenaH), mat(0x25292b), false, true);
  ground.rotation.x = -Math.PI/2;
  scene.add(ground);

  const roadMat = mat(0x101214), walkMat = mat(0x555a58), curbMat = mat(0xd2bd71), stripeMat = mat(0xdcd4a6);
  addPlane(0, 0, CFG.arenaW, 18, roadMat, .01);
  addPlane(0, 0, 18, CFG.arenaH, roadMat, .012);
  addPlane(0, 12.5, CFG.arenaW, 4, walkMat, .018);
  addPlane(0, -12.5, CFG.arenaW, 4, walkMat, .018);
  addPlane(12.5, 0, 4, CFG.arenaH, walkMat, .019);
  addPlane(-12.5, 0, 4, CFG.arenaH, walkMat, .019);
  addPlane(0, 9.7, CFG.arenaW, .35, curbMat, .025);
  addPlane(0, -9.7, CFG.arenaW, .35, curbMat, .025);
  addPlane(9.7, 0, .35, CFG.arenaH, curbMat, .026);
  addPlane(-9.7, 0, .35, CFG.arenaH, curbMat, .026);
  for (let x=-38; x<42; x+=12) addPlane(x, 0, 4.8, .32, stripeMat, .03);
  for (let z=-30; z<34; z+=12) addPlane(0, z, .32, 4.8, stripeMat, .031);

  addStreetDetails();
  addSpawnArchways();
  loadMapLayout(0);
}
function addPlane(x,z,w,d,material,y=0) {
  const p = mesh(new THREE.PlaneGeometry(w,d), material, false, true);
  p.rotation.x = -Math.PI/2; p.position.set(x,y,z); scene.add(p);
}
function addWall(x,z,w,h,d) {
  const visibleH = Math.min(h, 2.6);
  const wall = box(w,visibleH,d,0x505658);
  wall.position.set(x,visibleH/2,z);
  wall.receiveShadow = true;
  scene.add(wall);
  walls.push(wall);
  wallBounds.push({x,z,w,d});
  addWallNavPoints(x, z, w, d);
}
function loadMapLayout(index=0) {
  walls.forEach(w => scene.remove(w));
  walls = [];
  wallBounds = [];
  NAV_POINTS = BASE_NAV_POINTS.map(([x,z]) => new THREE.Vector3(x, 0, z));
  currentMapIndex = ((index % MAP_LAYOUTS.length) + MAP_LAYOUTS.length) % MAP_LAYOUTS.length;
  const layout = MAP_LAYOUTS[currentMapIndex];
  [...MAP_BOUNDARY_WALLS, ...layout.walls].forEach(([x,z,w,h,d]) => addWall(x,z,w,h,d));
  addAllGateNavPoints();
  closeSpawnGates(true);
}
function resetPlayersForMap() {
  const layout = MAP_LAYOUTS[currentMapIndex];
  players.forEach((p, i) => {
    const spawn = layout.spawns[i] || layout.spawns[0];
    p.position.set(spawn[0], 0, spawn[1]);
    p.rotation.y = spawn[2];
    p.rotation.z = p.userData.down ? .9 : 0;
    resolveWallOverlap(p, .72);
  });
}
function clearTransientEffects(includePowerups=false) {
  [...bullets, ...impacts, ...stunBursts, ...flames, ...corpses].forEach(o => scene.remove(o));
  bullets=[]; impacts=[]; stunBursts=[]; flames=[]; corpses=[];
  if (includePowerups) {
    powerups.forEach(o => scene.remove(o));

}
function transitionToNextMap() {
  currentZone++;
  loadMapLayout(currentMapIndex + 1);
  clearTransientEffects(true);
  resetPlayersForMap();
  cameraRig.pos = null; cameraRig.look = null;
  triggerFade(.95);
  screenShake = Math.max(screenShake, .55);
  breakMain = `ZONE ${currentZone}`;
  breakSub = `ENTERING ${MAP_LAYOUTS[currentMapIndex].name}`;
  breakTone = "map";
}
function triggerFade(duration=.75) {
  fadeTimer = duration;
  fadeMax = duration;
}
function updateFade(dt) {
  if (!fadeOverlay) return;
  fadeTimer = Math.max(0, fadeTimer - dt);
  if (fadeTimer <= 0) {
    fadeOverlay.style.opacity = "0";
    return;
  }
  const t = fadeTimer / Math.max(.01, fadeMax);
  fadeOverlay.style.opacity = `${Math.sin(t * Math.PI) * .58}`;
}
function addWallNavPoints(x, z, w, d) {
  const m = 3.4;
  const xs = [x - w / 2 - m, x + w / 2 + m];
  const zs = [z - d / 2 - m, z + d / 2 + m];
  xs.forEach(px => zs.forEach(pz => addNavPoint(px, pz)));
  addNavPoint(x, z - d / 2 - m);
  addNavPoint(x, z + d / 2 + m);
  addNavPoint(x - w / 2 - m, z);
  addNavPoint(x + w / 2 + m, z);
}
function addNavPoint(x, z) {
  if (x < -40 || x > 40 || z < -30 || z > 30) return;
  if (NAV_POINTS.some(p => Math.abs(p.x - x) < 1.1 && Math.abs(p.z - z) < 1.1)) return;
  NAV_POINTS.push(new THREE.Vector3(x, 0, z));
}

function addGateNavPoints(gate) {
  const side = new THREE.Vector3(gate.dir.z, 0, -gate.dir.x).normalize();
  [4.5, 8.5, 12.5].forEach(dist => {
    addNavPoint(gate.x + gate.dir.x * dist, gate.z + gate.dir.z * dist);
    addNavPoint(gate.x + gate.dir.x * dist + side.x * 4.2, gate.z + gate.dir.z * dist + side.z * 4.2);
    addNavPoint(gate.x + gate.dir.x * dist - side.x * 4.2, gate.z + gate.dir.z * dist - side.z * 4.2);
  });
}
function addAllGateNavPoints() {
  SPAWN_GATES.forEach(addGateNavPoints);
}

function setPlayerWeapon(player, type, now) {
  const u = player.userData;
  const parts = u.parts;
  if (!parts) return;
  if (parts.gun) player.remove(parts.gun);
  const weapon = makeHeldWeapon(type);
  weapon.position.set(.72, 2.65, -.95);
  weapon.rotation.y = Math.PI / 2;
  player.add(weapon);
  parts.gun = weapon;
  u.weapon = type;
  u.weaponUntil = type === "raygun" ? 0 : now + CFG.weaponDuration;
  u.lastShot = now - 1;
}

function updateCorpses(dt) {
  corpses.forEach(c => {
    c.userData.life -= dt;
    if (c.userData.life < CFG.corpseFade) {
      setGroupOpacity(c, Math.max(0, c.userData.life / CFG.corpseFade));
    }
  });
  corpses = corpses.filter(c => {
    if (c.userData.life > 0) return true;
    scene.remove(c);
    return false;
  });
}
function makePickupLabel(text, color) {
  const canvas = document.createElement("canvas");
  canvas.width = 256;
  canvas.height = 72;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "rgba(0,0,0,.74)";
  ctx.strokeStyle = `#${color.toString(16).padStart(6, "0")}`;
  ctx.lineWidth = 5;
  roundRect(ctx, 10, 10, 236, 52, 10);
  ctx.fill();
  ctx.stroke();
  ctx.font = "900 28px ui-monospace, Menlo, monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#f7efe2";
  ctx.shadowColor = `#${color.toString(16).padStart(6, "0")}`;
  ctx.shadowBlur = 12;
  ctx.fillText(text, 128, 37);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map:texture, transparent:true, depthWrite:false }));
  sprite.scale.set(2.9, .82, 1);
  sprite.position.y = 1.72;
  sprite.userData.effect = true;
  return sprite;
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
function makePowerup(type, x, z) {
  const group = new THREE.Group();
  group.position.set(x, CFG.powerupFloatY, z);
  group.userData = { type, life: 18, bob: Math.random() * 10 };
  const info = ITEM_INFO[type] || ITEM_INFO.med;
  const color = info.color;
  const base = cyl(.68, .18, color, 28);
  base.material = glowMat(color, .75);
  group.add(base);
  const halo = torus(.92, .042, color, 36, 8);
  halo.rotation.x = Math.PI / 2;
  halo.position.y = .26;
  halo.material = glowMat(color, .92);
  group.add(halo);
  const beam = cyl(.09, 1.45, color, 12);
  beam.position.y = .88;
  beam.material = new THREE.MeshBasicMaterial({ color, transparent:true, opacity:.28, depthWrite:false });
  group.add(beam);
  group.add(makePickupLabel(info.short, color));
  if (type === "med") {
    const a = box(.2,.1,.86,0xffffff); a.position.y=.28; group.add(a);
    const b = box(.86,.1,.2,0xffffff); b.position.y=.29; group.add(b);
  } else if (type === "rapid") {
    const bolt = cone(.32,1.05,0xfff3a0,16); bolt.rotation.z = Math.PI; bolt.position.y=.58; bolt.material=glowMat(0xfff3a0,.7); group.add(bolt);
    const mag = box(.18,.58,.42,0x171717); mag.position.set(.32,.42,0); mag.rotation.z=-.35; mag.material=mat(0x171717,.48,.28); group.add(mag);
  } else if (type === "bomb") {
    const bomb = sphere(.42,0xff8a2f,18); bomb.position.y=.42; bomb.material=glowMat(0xff8a2f,.65); group.add(bomb);
    const fuse = cyl(.04,.35,0x222222,8); fuse.rotation.z=.7; fuse.position.set(.22,.66,0); group.add(fuse);
    const spark = sphere(.09,0xfff08a,10); spark.position.set(.38,.84,0); spark.material=glowMat(0xfff08a,1); group.add(spark);
  } else if (type === "shield") {
    const ring = torus(.5,.055,0x78f4ff,28,8); ring.rotation.x=Math.PI/2; ring.position.y=.38; ring.material=glowMat(0x78f4ff,.8); group.add(ring);
    const dome = new THREE.Mesh(new THREE.SphereGeometry(.62, 20, 10), new THREE.MeshBasicMaterial({color:0x78f4ff, transparent:true, opacity:.18, wireframe:true}));
    dome.position.y = .56; group.add(dome);
  } else if (type === "crossbow") {
    const model = makeCrossbow();
    model.scale.setScalar(.92);
    model.position.y = .72;
    model.rotation.y = Math.PI / 2;
    group.add(model);
  } else if (type === "sword") {
    const model = makeSword();
    model.scale.setScalar(1.08);
    model.position.y = .76;
    model.rotation.z = -.75;
    group.add(model);
  }
  const light = new THREE.PointLight(color, 1.45, 11);
  light.position.y = 1.35;
  group.add(light);
  scene.add(group);
  powerups.push(group);
}
function maybeDropPowerup(pos, chance=.18) {
  if (Math.random() > chance || circleHitsWall(pos.x, pos.z, 1.2)) return;
  const types = ["med","rapid","bomb","shield","crossbow","sword"];
  makePowerup(types[Math.floor(rand(0, types.length))], pos.x, pos.z);
}
function spawnPowerup() {
  const types = ["med","rapid","bomb","shield","crossbow","sword"];
  for (let i=0;i<40;i++) {
    const x = rand(-36,36), z = rand(-26,26);
    if (!circleHitsWall(x, z, 1.2)) {
      makePowerup(types[Math.floor(rand(0, types.length))], x, z);
      return;
    }
  }
}
function updatePowerups(dt, now) {
  nextPowerup -= dt;
  if (nextPowerup <= 0) {
    spawnPowerup();
    nextPowerup = rand(CFG.powerupMin, CFG.powerupMax);
  }
  powerups.forEach(pu => {
    pu.userData.life -= dt;
    pu.userData.bob += dt * 3;
    pu.rotation.y += dt * 1.9;
    pu.position.y = CFG.powerupFloatY + Math.sin(pu.userData.bob) * .24;
    for (const p of players) {
      if (p.userData.down || p.userData.hp <= 0) continue;
      if (p.position.distanceTo(pu.position) < 3.05) {
        applyPowerup(p, pu.userData.type, now);
        pu.userData.life = 0;
        stunSplash(pu.position.clone().add(new THREE.Vector3(0,.8,0)), pu);
      }
    }
  });
  powerups = powerups.filter(pu => {
    if (pu.userData.life > 0) return true;
    scene.remove(pu);
    return false;
  });
}
function showPickupNotification(player, type) {
  const info = ITEM_INFO[type] || ITEM_INFO.med;
  const who = `P${player.userData.idx + 1}`;
  let main = `${who} PICKED UP ${info.label}`;
  let sub = "";
  if (type === "crossbow" || type === "sword") {
    main = `${who} ACQUIRED ${info.label}`;
    sub = "45 seconds";
  } else if (type === "rapid") {
    main = `${who} RAPID FIRE`;
    sub = `${CFG.rapidDuration} seconds`;
  } else if (type === "shield") {
    main = `${who} SHIELD ACTIVE`;
    sub = `${CFG.shieldDuration} seconds`;
  } else if (type === "bomb") {
    main = `${who} BOMB ACQUIRED`;
    sub = `Radius blast`;
  }
  showCenterMessage(main, sub, info.tone, 1.15);
}
function applyPowerup(player, type, now) {
  const u = player.userData;
  if (type === "med") u.hp = Math.min(CFG.playerHP, u.hp + 42);
  if (type === "rapid") u.rapidUntil = now + CFG.rapidDuration;
  if (type === "shield") u.shieldUntil = now + CFG.shieldDuration;
  if (type === "crossbow" || type === "sword") setPlayerWeapon(player, type, now);
  if (type === "bomb") {
    const origin = player.position.clone();
    screenShake = Math.max(screenShake, .65);
    bombPulse(origin);
    [...zombies].forEach(z => {
      if (z.userData.dead) return;
      const dist = z.position.distanceTo(origin);
      if (dist > CFG.bombRadius) return;
      z.userData.hp -= z.userData.type === "boss" ? 360 : 999;
      z.userData.stun = Math.max(z.userData.stun, CFG.stunTime);
      stunSplash(z.position.clone().add(new THREE.Vector3(0,2,0)), z);
      if (z.userData.hp <= 0) killZombie(z);
    });
  }
  showPickupNotification(player, type);
}
function bombPulse(pos) {
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(CFG.bombRadius, .075, 8, 80),
    new THREE.MeshBasicMaterial({ color:0xff8a2f, transparent:true, opacity:.82, depthWrite:false })
  );
  ring.position.set(pos.x, .16, pos.z);
  ring.rotation.x = Math.PI / 2;
  ring.userData = { life:.48, maxLife:.48 };
  scene.add(ring);
  impacts.push(ring);
}
function impact(pos) {
  const ring = new THREE.Mesh(new THREE.SphereGeometry(.45,16,8), new THREE.MeshBasicMaterial({color:0x70f7ff, transparent:true, opacity:.85, wireframe:true}));
  ring.position.copy(pos); ring.userData = {life:.28}; scene.add(ring); impacts.push(ring);
}
function stunSplash(pos, target) {
  const group = new THREE.Group();
  group.position.copy(pos);
  group.userData = {life:.42, target};
  const ringMat = new THREE.MeshBasicMaterial({color:0x7df7ff, transparent:true, opacity:.9, wireframe:true});
  const ring = new THREE.Mesh(new THREE.TorusGeometry(.85, .035, 8, 32), ringMat);
  ring.rotation.x = Math.PI / 2;
  group.add(ring);
  const core = new THREE.Mesh(new THREE.SphereGeometry(.18, 12, 8), new THREE.MeshBasicMaterial({color:0xdfffff, transparent:true, opacity:.95}));
  group.add(core);
  const light = new THREE.PointLight(0x7df7ff, 2.8, 8);
  group.add(light);
  for (let i=0; i<9; i++) {
    const bolt = new THREE.Mesh(new THREE.BoxGeometry(.035, .035, rand(.55, 1.25)), new THREE.MeshBasicMaterial({color:0x8fffff, transparent:true, opacity:.85}));
    bolt.position.set(rand(-.55,.55), rand(-.25,.55), rand(-.55,.55));
    bolt.rotation.set(rand(0,Math.PI), rand(0,Math.PI), rand(0,Math.PI));
    bolt.userData.spin = new THREE.Vector3(rand(-4,4), rand(-4,4), rand(-4,4));
    group.add(bolt);
  }
  scene.add(group);
  stunBursts.push(group);
}
function updateStunBurst(group, dt) {
  group.userData.life -= dt;
  const t = Math.max(0, group.userData.life / .42);
  group.scale.setScalar(1 + (1-t) * 1.4);
  group.children.forEach(child => {
    if (child.material) child.material.opacity = t;
    if (child.userData.spin) {
      child.rotation.x += child.userData.spin.x * dt;
      child.rotation.y += child.userData.spin.y * dt;
      child.rotation.z += child.userData.spin.z * dt;
    }
  });
}
function setGroupOpacity(group, alpha) {
  group.traverse(o => {
    if (!o.material) return;
    o.material.transparent = true;
    o.material.opacity = alpha;
  });
}
function updateHud(now) {
  const player = players[0];
  document.getElementById("leftHud").innerHTML = `SCORE ${score}<br>WAVE ${wave}${betweenWaves ? ` | NEXT ${Math.ceil(waveTimer)}` : ""}`;
  document.getElementById("rightHud").innerHTML = `ZONE ${currentZone}<br>HP ${player ? Math.max(0, Math.ceil(player.userData.hp)) : CFG.playerHP}`;
  for (let i=0;i<1;i++) {
    const p = players[i];
    const boxEl = document.getElementById(`p${i+1}Bar`);
    const hpEl = document.getElementById(`p${i+1}Hp`);
    const fillEl = document.getElementById(`p${i+1}Fill`);
    const effEl = document.getElementById(`p${i+1}Effects`);
    if (!p) {
      boxEl.classList.add("hidden");
      continue;
    }
    boxEl.classList.remove("hidden");
    const u = p.userData;
    const pct = Math.max(0, u.hp) / CFG.playerHP * 100;
    hpEl.textContent = u.down ? "DOWN" : `${Math.ceil(u.hp)}`;
    fillEl.style.width = `${pct}%`;
    fillEl.style.background = u.down ? "#555" : pct > 50 ? "linear-gradient(90deg,#58f076,#e4ff73)" : pct > 25 ? "#ffbc42" : "#ff4f4f";
    const effects = [];
    if (now < u.rapidUntil) effects.push(`RAPID ${Math.ceil(u.rapidUntil-now)}s`);
    if (now < u.shieldUntil) effects.push(`SHIELD ${Math.ceil(u.shieldUntil-now)}s`);
    if (u.weapon !== "raygun" && now < u.weaponUntil) effects.push(`${u.weapon.toUpperCase()} ${Math.ceil(u.weaponUntil-now)}s`);
    effEl.textContent = effects.join("  ");
  }
}
function nearestPlayer(pos) {
  let best=null, bd=Infinity;
  players.forEach(p => { if (p.userData.hp<=0) return; const d=p.position.distanceTo(pos); if(d<bd){bd=d; best=p;} });
  return best;
}
function forward(o) { return new THREE.Vector3(0,0,-1).applyQuaternion(o.quaternion); }
function setPhase(p) {
  phase = p;
  document.getElementById("menu").classList.toggle("hidden", p !== "menu");
  document.getElementById("pause").classList.toggle("hidden", p !== "pause");
  document.getElementById("over").classList.toggle("hidden", p !== "over");
  touchControls.classList.toggle("hidden", p !== "play");
  if (p !== "play") {
    mobileInput.fire = false;
    mobileInput.firePointer = null;
    mobileInput.movePointer = null;
    mobileInput.x = 0;
    mobileInput.y = 0;
    mobileInput.mag = 0;
    fireButton.classList.remove("active");
    joystickThumb.style.transform = "translate(-50%, -50%)";
  }
}

buildWorld();

const cameras = [new THREE.PerspectiveCamera(66, 1, .1, 180), new THREE.PerspectiveCamera(66, 1, .1, 180)];
function placeCamera(cam, p) {
  const f = forward(p), side = new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0), f).normalize();
  const portrait = innerHeight >= innerWidth;
  const back = portrait ? -17 : -13;
  const sideOffset = portrait ? .8 : 1.8;
  const height = portrait ? 10.8 : 8.2;
  const lookAhead = portrait ? 5.8 : 4;
  const desiredPos = p.position.clone().addScaledVector(f, back).addScaledVector(side, sideOffset).add(new THREE.Vector3(0,height,0));
  const desiredLook = p.position.clone().addScaledVector(f, lookAhead).add(new THREE.Vector3(0,2.0,0));
  if (!cameraRig.pos || !cameraRig.look) {
    cameraRig.pos = desiredPos.clone();
    cameraRig.look = desiredLook.clone();
  } else {
    const alpha = 1 - Math.exp(-cameraRig.dt * 3.2);
    cameraRig.pos.lerp(desiredPos, alpha);
    cameraRig.look.lerp(desiredLook, alpha);
  }
  cam.position.copy(cameraRig.pos);
  if (screenShake > 0) {
    cam.position.x += rand(-screenShake, screenShake) * .38;
    cam.position.y += rand(-screenShake, screenShake) * .2;
    cam.position.z += rand(-screenShake, screenShake) * .38;
  }
  cam.lookAt(cameraRig.look);
}
function render(now) {
  now *= .001;
  const dt = Math.min(now-last || 0, .05); last = now;
  cameraRig.dt = dt;
  update(dt, now);
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w,h,false);
  renderer.setScissorTest(true);
  const p = players[0];
  const cam = cameras[0];
  cam.aspect = w / h;
  cam.fov = h >= w ? 72 : 66;
  cam.updateProjectionMatrix();
  if (p) placeCamera(cam,p);
  renderer.setViewport(0,0,w,h);
  renderer.setScissor(0,0,w,h);
  renderer.render(scene,cam);
  renderer.setScissorTest(false);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
